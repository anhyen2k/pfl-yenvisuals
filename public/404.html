<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Yên Photo — đang chuyển trang…</title>
    <!-- Single Page Apps for GitHub Pages (spa-github-pages, MIT).
         GitHub Pages là hosting tĩnh: mở trực tiếp /pfl-yenvisuals/ve-toi sẽ 404.
         File này lưu đường dẫn vào ?/... rồi redirect về /pfl-yenvisuals/,
         script trong index.html sẽ khôi phục lại đường dẫn và App cuộn tới
         đúng mục. pathSegmentsToKeep = 1 vì project site có 1 đoạn tiền tố
         (/pfl-yenvisuals/). Không bao giờ trắng trang: nếu redirect lỗi,
         trình duyệt vẫn về trang chủ. -->
    <script>
      (function () {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
